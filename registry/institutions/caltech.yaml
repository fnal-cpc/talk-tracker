      Caltech division calendars share one CMS (also pma/pva/qse.caltech.edu). Listing
      supports /calendar/filter?...&series=<id>&past=1; each event has <url>?ical.
      Series id for Physics Colloquium to be found by probe.
  - id: caltech-astronomy-colloquium
    name: Astronomy Colloquium
    type: colloquium
    url: https://www.astro.caltech.edu/calendar/filter?date_start=&date_end=&type=all&search=&past=0&mc=1&series=22
