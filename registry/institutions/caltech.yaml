id: caltech
name: California Institute of Technology
country: US
timezone: America/Los_Angeles
series:
  - id: caltech-physics-colloquium
    name: Physics Colloquium
    type: colloquium
    url: https://physics.caltech.edu/events/seminar-calendar
    adapter: html
    params:
      list_url: https://physics.caltech.edu/events/seminar-calendar
