      list_url: https://www.astro.caltech.edu/calendar/filter?date_start=&date_end=&type=all&search=&past=0&mc=1&series=22
    domains: [www.astro.caltech.edu]
    keeps_past_events: true
    notes: Series id 22 (from an event page). Per-event iCal at <event url>?ical.
  - id: caltech-tapir-seminar
    name: TAPIR Seminar
    type: seminar
    url: https://physics.caltech.edu/events/seminar-calendar
    adapter: html
