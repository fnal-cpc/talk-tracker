# Survey 2026-10-07 (web search; feeds not yet probed live). Includes LBNL.
id: berkeley
name: UC Berkeley / Lawrence Berkeley National Laboratory
country: US
timezone: America/Los_Angeles
series:
  - id: berkeley-physics-colloquium
    name: Physics Colloquium
    type: colloquium
    url: https://events.berkeley.edu/physics/all/search/Colloquia
    adapter: html
    params:
      list_url: https://events.berkeley.edu/physics/all/search/Colloquia
    domains: [events.berkeley.edu]
    keeps_past_events: unknown
    notes: >-
      Linked from physics.berkeley.edu (Open Berkeley). events.berkeley.edu platform not
      identified (LiveWhale or Localist); probe for its feed before writing selectors.
  - id: berkeley-astronomy-colloquium
    name: Astronomy Colloquium
    type: colloquium
    url: https://astro.berkeley.edu/astronomy-colloquium
    adapter: html
    params:
      list_url: https://astro.berkeley.edu/astronomy-colloquium
    domains: [astro.berkeley.edu]
    keeps_past_events: true
    notes: Open Berkeley; term schedule table. Department events archive at /news/events/archive/.
  - id: berkeley-cosmology-seminar
    name: BCCP / Berkeley Cosmology Seminar
    type: seminar
    url: https://cosmology.lbl.gov/sem_bcg_future.html
    adapter: html
    params:
      list_url: https://cosmology.lbl.gov/sem_bcg_future.html
    domains: [cosmology.lbl.gov]
    keeps_past_events: true
    notes: >-
      Static hand-edited HTML (Tuesdays 1:10 pm). Yearly pages bcg_seminars_YY_YY.html and
      bcg_pastsems.html.
  - id: berkeley-lbnl-rpm
    name: LBNL Physics Division Research Progress Meeting (RPM)
    type: seminar
    url: https://rpm.physics.lbl.gov/
    adapter: tribe
    params:
      base_url: https://rpm.physics.lbl.gov
    domains: [rpm.physics.lbl.gov]
    keeps_past_events: true
    notes: >-
      WordPress with The Events Calendar (tribe-bar seen). Also Indico category 58 at
      indico.physics.lbl.gov and a Google Calendar subscription.
